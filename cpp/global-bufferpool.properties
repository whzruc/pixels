# Global ByteBuffer Pool Configuration
# This file configures the global buffer pool used by the Pixels plugin

# ===== Size Classes Configuration =====
# Define buffer size classes (in bytes)
# Format: global.bufferpool.size.class.N = <size_in_bytes>
# Buffers will be allocated in these predefined sizes

# Size Class 1: 1MB (1048576 bytes)
global.bufferpool.size.class.1=1048576

# Size Class 2: 8MB (8388608 bytes)
global.bufferpool.size.class.2=8388608

# Size Class 3: 64MB (67108864 bytes)
global.bufferpool.size.class.3=67108864

# Size Class 4: 128MB (134217728 bytes)
global.bufferpool.size.class.4=134217728

# ===== Pre-allocation Configuration =====
# Define how many buffers to pre-allocate for each size class
# Formula: pre_alloc_count = num_threads × multiplier
# Format: global.bufferpool.prealloc.multiplier.N = <multiplier>

# Class 1 (1MB): numThreads × 80 buffers
global.bufferpool.prealloc.multiplier.1=100

# Class 2 (8MB): numThreads × 40 buffers
global.bufferpool.prealloc.multiplier.2=40

# Class 3 (64MB): numThreads × 10 buffers
global.bufferpool.prealloc.multiplier.3=10

# Class 4 (128MB): numThreads × 5 buffers
global.bufferpool.prealloc.multiplier.4=5

# ===== Limits Configuration =====
# Maximum buffer size allowed (in bytes)
# Requests larger than this will throw an exception
global.bufferpool.max.buffer.size=134217728

# Maximum total memory limit for the pool (in bytes)
# 0 = no limit (reserved for future use)
global.bufferpool.max.memory.limit=0

# ===== Statistics Configuration =====
# Enable memory statistics collection and reporting
# When enabled, statistics will be printed after each query
global.bufferpool.enable.stats=false
