# Parquet Reader Performance Test Configuration

# Test data files (comma-separated list of .parquet files or glob patterns)
test.data.files=/data/9a3-01/clickbench/parquet-e0/hits/*.parquet
# test.data.files=/path/to/file1.parquet,/path/to/file2.parquet

# Number of threads to use for reading (-1 means use all CPU cores)
test.threads=1

# Enable direct I/O for better performance
localfs.enable.direct.io=false

# Row group range to read (start_index, count)
# -1 for count means read all row groups
test.rg.start=0
test.rg.count=-1

# Query ID for tracking
test.query.id=1

# Enable data verification (reads first row group twice to verify correctness)
test.verify.data=false