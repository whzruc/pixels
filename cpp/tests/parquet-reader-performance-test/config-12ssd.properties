# Parquet Reader Performance Test Configuration for 24 SSDs
# This configuration demonstrates how to test with data distributed across 24 SSDs

# Test data files - comma-separated list of directory patterns for 24 SSDs
# Each directory pattern will be expanded using glob
test.data.files=/data/9a3-01/clickbench/parquet/*.parquet,/data/9a3-02/clickbench/parquet/*.parquet,/data/9a3-03/clickbench/parquet/*.parquet,/data/9a3-04/clickbench/parquet/*.parquet,/data/9a3-05/clickbench/parquet/*.parquet,/data/9a3-06/clickbench/parquet/*.parquet,/data/9a3-07/clickbench/parquet/*.parquet,/data/9a3-08/clickbench/parquet/*.parquet,/data/9a3-09/clickbench/parquet/*.parquet,/data/9a3-10/clickbench/parquet/*.parquet,/data/9a3-11/clickbench/parquet/*.parquet,/data/9a3-12/clickbench/parquet/*.parquet
# Number of threads to use for reading (24 threads for 24 SSDs)
test.threads=24

# Enable direct I/O for better performance
localfs.enable.direct.io=true

# Row group range to read (start_index, count)
# -1 for count means read all row groups
test.rg.start=0
test.rg.count=-1

# Query ID for tracking
test.query.id=1

# Enable data verification (reads first row group twice to verify correctness)
test.verify.data=false
